[project]
name = "radar-api"
version = "0.1.0"
description = "Minimal read/write API for Engineering-Radar."
requires-python = ">=3.12"
dependencies = [
    "radar-core",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv.sources]
radar-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_api"]
