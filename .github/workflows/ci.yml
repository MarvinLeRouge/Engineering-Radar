name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  radar-core:
    name: radar-core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests with coverage
        run: |
          uv run --package radar-core pytest radar-core/tests \
            --cov=radar_core --cov-report=term-missing --cov-fail-under=80 -q

  radar-audit-fast:
    name: radar-audit (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests with coverage (excludes slow tests)
        run: |
          uv run --package radar-audit pytest radar-audit/tests -m "not slow" \
            --cov=radar_audit --cov-report=term-missing --cov-fail-under=80 -q

  radar-audit-slow:
    name: radar-audit (slow, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: "10"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Install dependencies
        run: uv sync --locked

      - name: Run slow tests (real npx/composer fetches, needs network)
        continue-on-error: true
        run: uv run --package radar-audit pytest radar-audit/tests -m "slow" -q

  radar-api:
    name: radar-api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests with coverage
        run: |
          uv run --package radar-api pytest radar-api/tests \
            --cov=radar_api --cov-report=term-missing --cov-fail-under=80 -q

  radar-online:
    name: radar-online
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests with coverage
        run: |
          uv run --package radar-online pytest radar-online/tests \
            --cov=radar_online --cov-report=term-missing --cov-fail-under=80 -q

  radar-dashboard:
    name: radar-dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: radar-dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: radar-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx oxlint . && npx eslint .

      - name: Check formatting
        run: npx prettier --check src/

      - name: Type-check (app and tests, same as the production build)
        run: npm run type-check

      - name: Run tests with coverage
        run: npm run test:coverage

  radar-dashboard-e2e:
    name: radar-dashboard (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: radar-dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: radar-dashboard/package-lock.json

      - name: Install dependencies
        run: |
          uv sync --locked
          npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Seeds a throwaway database, starts radar-api and the built dashboard (playwright.config.ts).
      - name: Run end-to-end tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            radar-dashboard/playwright-report/
            radar-dashboard/test-results/
          retention-days: 7
