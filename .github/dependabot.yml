version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    versioning-strategy: "lockfile-only"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/radar-dashboard"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint caps its typescript peer below each new major (8.72 supports <6.1):
      # bump typescript by hand once typescript-eslint supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # vitest and its plugins must move together, majors included (a vitest major may still
      # come without @vitest/coverage-v8: then bump both by hand).
      vitest:
        patterns: ["vitest", "@vitest/*"]
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directories:
      - "/radar-api"
      - "/radar-online"
      - "/radar-audit"
      - "/radar-dashboard"
    ignore:
      # The Python minor is a portfolio-wide decision (.python-version, requires-python, CI):
      # only patch/digest updates of the python base image come from Dependabot.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
