[project]
name = "radar-online"
version = "0.1.0"
description = "Hosted service publishing sanitized Engineering-Radar reports, trends and badges."
requires-python = ">=3.14"
dependencies = [
    "radar-core",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "sentry-sdk>=2.73.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv.sources]
radar-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_online"]
