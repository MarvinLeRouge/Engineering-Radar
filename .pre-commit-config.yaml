default_install_hook_types: [pre-commit, post-commit]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(radar-core|radar-audit|radar-api)/
      - id: ruff-format
        files: ^(radar-core|radar-audit|radar-api)/
  - repo: local
    hooks:
      - id: mypy-radar-core
        name: mypy (radar-core)
        entry: uv run --package radar-core mypy radar-core/src/radar_core
        language: system
        files: ^radar-core/src/
        pass_filenames: false
      - id: mypy-radar-audit
        name: mypy (radar-audit)
        entry: uv run --package radar-audit mypy radar-audit/src/radar_audit
        language: system
        files: ^radar-audit/src/
        pass_filenames: false
      - id: mypy-radar-api
        name: mypy (radar-api)
        entry: uv run --package radar-api mypy radar-api/src/radar_api
        language: system
        files: ^radar-api/src/
        pass_filenames: false
      # Dashboard: whole-project checks, like mypy, through its own npm scripts.
      - id: eslint
        name: eslint + oxlint (radar-dashboard)
        entry: npm --prefix radar-dashboard run lint
        language: system
        files: ^radar-dashboard/
        pass_filenames: false
      - id: prettier
        name: prettier (radar-dashboard)
        entry: npm --prefix radar-dashboard run format
        language: system
        files: ^radar-dashboard/src/
        pass_filenames: false
      - id: vue-tsc
        name: vue-tsc (radar-dashboard)
        entry: npm --prefix radar-dashboard run type-check
        language: system
        files: ^radar-dashboard/
        pass_filenames: false
      - id: changelog
        name: Update CHANGELOG.md (git-cliff)
        entry: bash scripts/changelog-post-commit.sh
        language: system
        stages: [post-commit]
        pass_filenames: false
        always_run: true
